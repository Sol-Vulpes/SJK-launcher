[package]
name = "sith-cloud"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "Serves a folder of PK3s as a JoF-style content repository"

[dependencies]
tiny_http = "0.12"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false }
ed25519-dalek = "3.0.0"
base64 = "0.23.1"
# Model sync's pack checks, shared with SJK (docs/model-sync.md there).
sjk-model-sync = { git = "https://github.com/Sol-Vulpes/SJK", rev = "c2191ef16f47c6e0b1207a4e06563ca8279f250a" }

[dev-dependencies]
sjk-jof-content = { git = "https://github.com/Sol-Vulpes/SJK", tag = "sjk-v2026.1102.1" }
